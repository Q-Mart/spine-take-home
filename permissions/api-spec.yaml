openapi: 3.0.0
info:
  title: Permissions Service API
  version: 1.0.0
  description: API for setting/retreiving permissions for users

paths:
  /permissions/v1/access/{asset-id}:
    get:
      tags:
        - Permissions
      summary: Check whether the caller has access to the asset
      security:
        - cookieAuth: [ ]

components:
  securitySchemes:
    cookieAuth: # arbitrary name for the security scheme; will be used in the "security" key later
      type: apiKey
      in: cookie
      name: JSESSIONID # cookie name